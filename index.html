<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Haushaltsbuch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/pouchdb@7.3.1/dist/pouchdb.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-4">

    <div class="max-w-2xl mx-auto">
        <!-- Header -->
        <header class="bg-indigo-600 text-white p-4 rounded-2xl shadow-md mb-6 flex justify-between items-center">
            <h1 class="text-xl font-bold">Mein Haushaltsbuch</h1>
            <button onclick="logoutPasswort()" class="text-xs bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-lg">Sperren / Passwort löschen</button>
        </header>

        <!-- Passwort Bereich -->
        <div id="passwordArea" class="bg-white p-6 rounded-2xl shadow-sm border mb-6 text-center">
            <h2 class="text-lg font-bold text-gray-900 mb-2">Master-Passwort eingeben</h2>
            <p class="text-sm text-gray-600 mb-4">Gib dein festes Passwort ein, um die Daten zu entsperren:</p>
            <form onsubmit="initDatabase(event)" class="max-w-md mx-auto space-y-3">
                <input type="password" id="userPassword" placeholder="Dein Master-Passwort" required class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                
                <div class="flex items-center justify-center gap-2 text-sm text-gray-600">
                    <input type="checkbox" id="rememberPassword" class="w-4 h-4 text-indigo-600 rounded">
                    <label for="rememberPassword">Passwort auf diesem Gerät speichern (Auto-Login)</label>
                </div>

                <button type="submit" class="w-full bg-indigo-600 text-white font-semibold px-6 py-2 rounded-xl hover:bg-indigo-700 transition">
                    Entschlüsseln
                </button>
            </form>
        </div>

        <!-- Hauptbereich -->
        <div id="mainContent" class="hidden">
            <!-- Budget Übersicht -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                <div class="bg-white p-4 rounded-xl shadow-sm border">
                    <p class="text-xs text-gray-400 font-semibold uppercase">Startbudget</p>
                    <div class="flex items-center gap-1 mt-1">
                        <input type="number" id="budgetInput" value="250" onchange="renderUI()" class="text-xl font-bold w-24 border-b text-gray-800">
                        <span class="font-bold">€</span>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border">
                    <p class="text-xs text-gray-400 font-semibold uppercase">Ausgaben</p>
                    <p id="totalExpenses" class="text-xl font-bold text-red-600 mt-1">0,00 €</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border">
                    <p class="text-xs text-gray-400 font-semibold uppercase">Verbleibend</p>
                    <p id="remainingBudget" class="text-xl font-bold text-emerald-600 mt-1">250,00 €</p>
                </div>
            </div>

            <!-- Formular -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border mb-6">
                <h3 class="font-bold mb-4">Neue Ausgabe hinzufügen</h3>
                <form onsubmit="addExpense(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <select id="expenseCategory" class="p-2 border rounded-xl bg-gray-50">
                        <option value="Sonstiges">Sonstiges</option>
                        <option value="Lebensmittel">Lebensmittel</option>
                        <option value="Kleidung">Kleidung</option>
                        <option value="Elektronik">Elektronik</option>
                        <option value="Tanken">Tanken</option>
                    </select>
                    <input type="text" id="expenseName" placeholder="Posten / Beschreibung" required class="p-2 border rounded-xl bg-gray-50">
                    <input type="number" step="0.01" id="expenseAmount" placeholder="Betrag in €" required class="p-2 border rounded-xl bg-gray-50">
                    <button type="submit" class="sm:col-span-3 bg-indigo-600 text-white font-semibold py-2 rounded-xl hover:bg-indigo-700">Speichern</button>
                </form>
            </div>

            <!-- Tabelle -->
            <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 text-xs text-gray-500 uppercase border-b">
                        <tr>
                            <th class="p-3">Kategorie</th>
                            <th class="p-3">Posten</th>
                            <th class="p-3 text-right">Betrag</th>
                            <th class="p-3 text-center">Aktion</th>
                        </tr>
                    </thead>
                    <tbody id="expenseTableBody" class="divide-y text-sm">
                        <tr><td colspan="4" class="text-center py-4 text-gray-400">Keine Daten vorhanden.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let localDB = null;
        let remoteDB = null;
        let currentPassword = "";
        let allExpenses = [];

        const COUCHDB_URL = ""; 

        window.addEventListener('DOMContentLoaded', () => {
            const savedPassword = localStorage.getItem('haushaltsbuch_saved_pw');
            if (savedPassword) {
                document.getElementById('userPassword').value = savedPassword;
                document.getElementById('rememberPassword').checked = true;
                initDatabase();
            }
        });

        async function initDatabase(e) {
            if (e) e.preventDefault();
            const pwInput = document.getElementById('userPassword').value;
            const remember = document.getElementById('rememberPassword').checked;

            if (!pwInput) return;

            localDB = new PouchDB('haushaltsbuch_pouch');

            try {
                // Prüfen, ob bereits ein Master-Schloss in der DB existiert
                let lockDoc;
                try {
                    lockDoc = await localDB.get('master_lock');
                } catch (err) {
                    // Existiert noch nicht -> Dies ist der Erststart, wir legen das Schloss an!
                }

                if (lockDoc) {
                    // Testen, ob das eingegebene Passwort das richtige ist
                    try {
                        let bytes = CryptoJS.AES.decrypt(lockDoc.encryptedData, pwInput);
                        let decrypted = bytes.toString(CryptoJS.enc.Utf8);
                        if (decrypted !== "VALID_MASTER_KEY") {
                            alert("Falsches Passwort! Zugriff verweigert.");
                            return;
                        }
                    } catch (err) {
                        alert("Falsches Passwort! Zugriff verweigert.");
                        return;
                    }
                } else {
                    // Erster Start: Master-Schloss mit diesem Passwort für immer festlegen
                    const encryptedMarker = CryptoJS.AES.encrypt("VALID_MASTER_KEY", pwInput).toString();
                    await localDB.put({
                        _id: 'master_lock',
                        encryptedData: encryptedMarker
                    });
                }

                currentPassword = pwInput;

                if (remember) {
                    localStorage.setItem('haushaltsbuch_saved_pw', currentPassword);
                } else {
                    localStorage.removeItem('haushaltsbuch_saved_pw');
                }

                if (COUCHDB_URL) {
                    remoteDB = new PouchDB(COUCHDB_URL);
                    localDB.sync(remoteDB, { live: true, retry: true })
                        .on('change', () => loadExpenses())
                        .on('error', (err) => console.error("Sync Fehler:", err));
                }

                document.getElementById('passwordArea').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                loadExpenses();

            } catch (err) {
                console.error("Fehler beim Initialisieren:", err);
                alert("Ein Fehler ist aufgetreten.");
            }
        }

        async function loadExpenses() {
            if (!localDB) return;
            try {
                const result = await localDB.allDocs({ include_docs: true });
                allExpenses = [];

                for (let row of result.rows) {
                    // Das System-Schloss-Dokument überspringen
                    if (row.id === 'master_lock') continue;

                    if (row.doc.encryptedData) {
                        try {
                            let bytes = CryptoJS.AES.decrypt(row.doc.encryptedData, currentPassword);
                            let decrypted = JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
                            decrypted._id = row.doc._id;
                            decrypted._rev = row.doc._rev;
                            allExpenses.push(decrypted);
                        } catch (e) {
                            console.error("Entschlüsselungsfehler:", row.doc._id);
                        }
                    }
                }
                renderUI();
            } catch (err) {
                console.error("Fehler beim Laden:", err);
            }
        }

        async function addExpense(e) {
            e.preventDefault();
            const category = document.getElementById('expenseCategory').value;
            const name = document.getElementById('expenseName').value;
            const amount = parseFloat(document.getElementById('expenseAmount').value);

            if (!name || isNaN(amount)) return;

            const payload = JSON.stringify({ category, name, amount, date: new Date().toISOString() });
            const encrypted = CryptoJS.AES.encrypt(payload, currentPassword).toString();

            const doc = {
                _id: 'expense_' + Date.now(),
                encryptedData: encrypted
            };

            await localDB.put(doc);
            document.getElementById('expenseName').value = '';
            document.getElementById('expenseAmount').value = '';
            loadExpenses();
        }

        async function deleteExpense(id) {
            if (!confirm("Eintrag wirklich löschen?")) return;
            const doc = await localDB.get(id);
            await localDB.remove(doc);
            loadExpenses();
        }

        function renderUI() {
            const tableBody = document.getElementById('expenseTableBody');
            tableBody.innerHTML = '';
            let totalExpense = 0;

            if (allExpenses.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-gray-400">Keine Daten vorhanden.</td></tr>`;
            } else {
                allExpenses.forEach(item => {
                    totalExpense += item.amount;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="p-3"><span class="px-2 py-1 bg-gray-100 rounded text-xs">${item.category}</span></td>
                        <td class="p-3 font-medium">${item.name}</td>
                        <td class="p-3 text-right font-bold">${item.amount.toFixed(2).replace('.', ',')} €</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteExpense('${item._id}')" class="text-red-500 hover:text-red-700 font-bold px-2 py-1">✕</button>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });
            }

            const budgetVal = parseFloat(document.getElementById('budgetInput').value) || 250;
            const remaining = budgetVal - totalExpense;

            document.getElementById('totalExpenses').textContent = totalExpense.toFixed(2).replace('.', ',') + ' €';
            document.getElementById('remainingBudget').textContent = remaining.toFixed(2).replace('.', ',') + ' €';
        }

        function logoutPasswort() {
            localStorage.removeItem('haushaltsbuch_saved_pw');
            location.reload();
        }
    </script>
</body>
</html>
